services:
  liedin:
    container_name: liedin-app
    image: ${LIEDIN_IMAGE:-liedin-app:latest}
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "${APP_HTTP_PORT:-3000}:3000"
      - "${APP_BACKEND_PORT:-5000}:5000"
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://127.0.0.1:5000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Prisma default SQLite path bundled with Next standalone output
      DATABASE_URL: file:/app/prisma/dev.db
    volumes:
      - liedin_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  liedin_uploads: {}
